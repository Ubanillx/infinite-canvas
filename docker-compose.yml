services:
  app:
    image: ${APP_IMAGE:-infinite-canvas:local}
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      INFINITE_CANVAS_DATA_DIR: /data
      INFINITE_CANVAS_ALLOWED_NETWORKS: ${INFINITE_CANVAS_ALLOWED_NETWORKS:-127.0.0.1,::1,192.168.0.0/22,172.16.0.0/12}
      INFINITE_CANVAS_ALLOWED_HOSTS: ${INFINITE_CANVAS_ALLOWED_HOSTS:-localhost,ubuntu-server}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    volumes:
      - infinite-canvas-data:/data
      - infinite-canvas-agent:/home/node/.infinite-canvas
      - infinite-canvas-codex:/home/node/.codex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  infinite-canvas-data:
  infinite-canvas-agent:
  infinite-canvas-codex:
