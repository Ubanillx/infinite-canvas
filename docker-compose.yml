services:
  app:
    image: ${APP_IMAGE:-infinite-canvas:local}
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      INFINITE_CANVAS_DATA_DIR: /data
      INFINITE_CANVAS_ALLOWED_NETWORKS: ${INFINITE_CANVAS_ALLOWED_NETWORKS:-127.0.0.1,::1,192.168.0.0/22,172.16.0.0/12}
      INFINITE_CANVAS_ALLOWED_HOSTS: ${INFINITE_CANVAS_ALLOWED_HOSTS:-localhost,ubuntu-server}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://infinite:infinite_canvas_dev@postgres:5432/infinite_canvas}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-infinite-canvas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-infinite}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-infinite_canvas_dev}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - infinite-canvas-data:/data
      - infinite-canvas-agent:/home/node/.infinite-canvas
      - infinite-canvas-codex:/home/node/.codex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infinite_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-infinite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinite_canvas_dev}
    volumes:
      - infinite-canvas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-infinite}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-infinite_canvas_dev}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - infinite-canvas-rustfs:/data
      - infinite-canvas-rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-infinite}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-infinite_canvas_dev}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-infinite-canvas}
    restart: "no"

volumes:
  infinite-canvas-data:
  infinite-canvas-agent:
  infinite-canvas-codex:
  infinite-canvas-postgres:
  infinite-canvas-rustfs:
  infinite-canvas-rustfs-logs:
